# Local infrastructure shared by every worktree (one set of containers per machine).
name: codeyoung

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codeyoung
      POSTGRES_PASSWORD: codeyoung
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codeyoung -d codeyoung_dev']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      TZ: UTC
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
